# Databricks Apps reads two keys here: command and env. Dependencies are not declared in this
# file; the runtime installs requirements.txt from the app's source directory on its own.
command:
  - "python"
  - "app.py"

env:
  - name: APP_NAME
    value: "weather-mcp-dashboard"
  # The National Weather Service wants a contact address in the User-Agent header. It is read
  # from a Databricks secret so no address lands in this repo. The app's service principal needs
  # READ on the scope. NWS_CONTACT_EMAIL is only the fallback if the lookup fails.
  - name: NWS_CONTACT_SECRET_SCOPE
    value: "weather-mcp"
  - name: NWS_CONTACT_SECRET_KEY
    value: "nws-contact-email"
  - name: NWS_CONTACT_EMAIL
    value: "change-me@example.com"
  # The query log is read from the Lakebase table that schema_weather_queries.sql creates. This
  # app only reads it; the MCP server does the writing. The app's service principal needs READ on
  # this scope. If the secret cannot be resolved the recent-queries panel says so.
  - name: LAKEBASE_SECRET_SCOPE
    value: "weather-mcp"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
